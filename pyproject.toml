[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-petrovaradinska-tvrdjava"
version = "0.1.0"
description = "A source-grounded knowledge system for Petrovaradin and its fortress"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langcodes>=3.5,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]

pdf = ["pypdf>=5,<8"]
dev = ["mypy>=1.15,<3", "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
validate-catalog = "llm_petrovaradinska_tvrdjava.catalog:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_petrovaradinska_tvrdjava = ["review_data/*.json", "review_data/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
