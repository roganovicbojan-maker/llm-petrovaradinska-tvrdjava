<section aria-labelledby="answer-title">
  <h2 id="answer-title">Pitanje o tvrđavi</h2>
  <p>AI odgovor je generisan. Automatska provera povezuje citate sa pronađenim zapisima
    i proverava brojeve. Za istorijsku ocenu pogledaj stručnu proveru u dosijeu.</p>
  <form id="answer-form" action="/api/v1/answers" method="post">
    <label for="answer-question">Postavi pitanje</label><br>
    <input id="answer-question" name="question" required maxlength="160"
           placeholder="Šta je predloženo za 1754?">
    <button>Odgovori iz izvora</button>
  </form>
  <p id="answer-status" role="status"></p>
  <div id="answer-result"></div>
</section>
<script>
  const answerForm = document.getElementById("answer-form");
  const answerStatus = document.getElementById("answer-status");
  const answerResult = document.getElementById("answer-result");

  answerForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = new FormData(answerForm).get("question").trim();
    if (!question) {
      answerStatus.textContent = "Unesi pitanje.";
      return;
    }
    const button = answerForm.querySelector("button");
    button.disabled = true;
    answerResult.replaceChildren();
    answerStatus.textContent = "Tražim izvore i sastavljam odgovor…";

    try {
      const response = await fetch(answerForm.action, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question}),
      });
      const data = await response.json();
      if (!response.ok) {
        answerStatus.textContent = typeof data.detail === "string" ? data.detail :
          "Odgovor trenutno nije dostupan.";
        return;
      }
      if (data.status === "insufficient_evidence") {
        answerStatus.textContent = "Dostupni dosijei nemaju dovoljno dokaza za odgovor.";
        return;
      }
      answerStatus.textContent = data.verification === "model_checked"
        ? "Generisan odgovor. Podršku iskazu proverio je model."
        : "Generisan odgovor. Iskaz se poklapa sa citiranim zapisom.";
      const references = new Map(data.references.map(ref => [ref.evidence_id, ref.match]));
      const list = document.createElement("ul");
      for (const claim of data.claims) {
        const item = document.createElement("li");
        const text = document.createElement("p");
        text.textContent = claim.text;
        item.append(text);

        const sources = document.createElement("ul");
        for (const id of claim.evidence_ids) {
          const match = references.get(id);
          const cited = match.observation.evidence.filter(evidence =>
            evidence.role === "supports" && evidence.source_id === claim.source_id);
          const source = document.createElement("li");
          const link = document.createElement("a");
          link.href = "/reviews/" + encodeURIComponent(match.dossier_id) + "#" +
            encodeURIComponent(match.observation.observation_id);
          link.textContent = cited[0].source.title + " · " + cited.map(e => e.locator).join(", ");
          source.append(link);
          const status = document.createElement("small");
          status.textContent = match.observation.expert_review
            ? "Stručna provera navoda: " + match.observation.expert_review.checked_on
            : "Navod nema evidentiranu stručnu proveru.";
          source.append(status);
          for (const evidence of match.observation.evidence) {
            const entry = document.createElement("small");
            const labels = {supports: "Potkrepljuje", contradicts: "Protivreči", context: "Kontekst"};
            entry.textContent = labels[evidence.role] + " · " + evidence.source.title
              + " · " + evidence.locator;
            source.append(entry);
          }
          for (const evidence of cited) {
            if (!evidence.intermediary) continue;
            const via = document.createElement("small");
            via.textContent = "Prema posredniku: " + evidence.intermediary.title +
              " · " + evidence.via.locator;
            source.append(via);
          }
          sources.append(source);
        }
        item.append(sources);
        list.append(item);
      }
      answerResult.append(list);
      for (const comparison of data.estimate_comparisons || []) {
        const heading = document.createElement("h3");
        heading.textContent = "Različite procene u katalogu: " + comparison.topic;
        const scope = document.createElement("p");
        scope.textContent = "Izvori mogu brojati različite kategorije. Proveri obuhvat svake procene.";
        const estimates = document.createElement("ul");
        for (const item of comparison.estimates) {
          const row = document.createElement("li");
          const link = document.createElement("a");
          link.href = "/reviews/" + encodeURIComponent(comparison.dossier_id) + "#" +
            encodeURIComponent(item.observation_id);
          link.textContent = item.source_title + " · " + item.citation.locator;
          const e = item.estimate;
          const quantity = e.low != null ? e.low + "–" + e.high : e.value;
          const details = document.createElement("p");
          details.textContent = (e.approximate ? "oko " : "") + quantity + " " + e.unit +
            " · " + e.counted_population + " · " + e.counting_definition;
          row.append(link, details);
          estimates.append(row);
        }
        answerResult.append(heading, scope, estimates);
      }
    } catch {
      answerStatus.textContent = "Došlo je do greške pri učitavanju odgovora.";
    } finally {
      button.disabled = false;
    }
  });
</script>
