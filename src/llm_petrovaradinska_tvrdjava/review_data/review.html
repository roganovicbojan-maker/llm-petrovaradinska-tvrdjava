<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title · Petrovaradinska tvrđava</title>
  <style>
    :root { color-scheme: light; --paper:#f5f1e8; --ink:#182922; --muted:#4b5c50;
      --line:#dad7cb; --accent:#26624e; --white:#fffdf7; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink);
      font: 1rem/1.55 system-ui, sans-serif; }
    main { max-width:76rem; margin:auto; padding:2.5rem clamp(.85rem,4vw,3rem) 4rem; }
    header { border-bottom:1px solid var(--line); padding-bottom:1.2rem; }
    header p { max-width:68ch; color:var(--muted); }
    h1,h2 { margin:.2rem 0 .55rem; font-family:Georgia,serif; line-height:1.15; }
    h1 { font-size:clamp(2rem,6vw,4.25rem); }
    h2 { font-size:clamp(1.4rem,3.5vw,2rem); }
    section, form { margin-top:2rem; }
    header a+a { margin-left:1rem; }
    input, button { font: inherit; padding:.45rem .65rem; }
    input { width:min(100%,24rem); }
    button { margin-left:.25rem; }
    ol li+li { margin-top:.7rem; }
    .scroll { overflow-x:auto; border:1px solid var(--line); border-radius:.55rem; }
    table { width:100%; min-width:46rem; border-collapse:collapse; background:var(--white); }
    th,td { text-align:left; vertical-align:top; padding:.75rem 1rem; }
    thead { background:#e7ebe1; }
    tbody tr+tr { border-top:1px solid var(--line); }
    tbody th { width:19%; }
    td:nth-child(2),td:nth-child(3) { width:30%; }
    small { display:block; color:var(--muted); font-weight:400; margin-top:.2rem; }
    a { color:var(--accent); text-underline-offset:.16em; overflow-wrap:anywhere; }
    .via { border-left:2px solid var(--line); padding-left:.65rem; margin-top:.65rem; }
    .status { display:inline-block; background:#edf0e6; border-radius:.3rem;
      padding:.12rem .45rem; white-space:nowrap; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>$title</h1>
      $summary
      $navigation
    </header>
    $sections
  </main>
</body>
</html>
